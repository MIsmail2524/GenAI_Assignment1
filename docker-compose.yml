version: "3.9"

services:
  backend:
    build: ./backend
    container_name: restoration-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - ONNX_DIR=/app/models
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: restoration-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8000
    restart: unless-stopped